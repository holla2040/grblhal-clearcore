; grblhal-clearcore — bare-metal build, no framework.
; Startup/system/vector code lives in src/, linker script in ld/,
; device headers vendored under vendor/ (see vendor/README.md).
; Flash/debug via Atmel-ICE + OpenOCD: see Makefile (NEVER chip-erase —
; the Teknic bootloader lives in the first 16 KB).

[env:clearcore]
platform = atmelsam
board = teknic_clearcore
; no framework line — bare build
board_build.ldscript = ld/flash_with_bootloader.ld
build_flags =
    -D__SAME53N19A__
    -D__SAME53__
    -DOVERRIDE_MY_MACHINE
    -include src/my_machine.h
    -Ivendor/dfp/include
    -Ivendor/cmsis/include
    -Isrc
debug_tool = atmel-ice
